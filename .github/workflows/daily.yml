# Daily run for Agent 1.
# Manual trigger via workflow_dispatch; scheduled trigger via cron.

name: Daily fetch

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

# Prevent two runs from racing each other on the same checkpoint.
concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    # Required to commit changes back to the repo.
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run checkpoint self-test
        run: python checkpoint.py
      
      # Commit any changes (e.g. to data/processed_ids.json) back to the repo.
      # --allow-empty so we don't fail when there's nothing to commit.
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update checkpoint [auto]"
          git push
